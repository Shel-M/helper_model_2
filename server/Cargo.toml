[package]
name = "server"
version = "0.1.0"
edition = "2021"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
enum_glob_use = "deny"
pedantic = "deny"
nursery = "deny"
unwrap_used = "deny"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0.210", features = ["derive"] }
tokio = { version = "1.40.0", features = ["macros", "rt-multi-thread", "signal"] }
toml = "1.0"
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
sqlx = { version = "0.8.2", features = ["runtime-tokio", "sqlite"] }

[dev-dependencies]
env_logger = "0.11"
serde_json = "1"
tokio-test = "0.4"
test-log = "0.2"

